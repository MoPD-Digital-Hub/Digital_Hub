name: Deploy Project

# Pushing to `production` deploys it on the server with Docker (deploy/deploy.sh).
on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on the server
        run: |
          # Update the checkout first, so the deploy script that runs is the new one.
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'set -e; cd /mnt/data/Digital_Hub; git fetch origin production; git reset --hard origin/production; bash deploy/deploy.sh --no-pull'
