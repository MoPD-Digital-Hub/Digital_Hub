# Local development: the whole stack in Docker.
#
#   cp .env.example .env        # then fill in the keys you have
#   docker compose up --build   # http://localhost:8000
#
# The code in ./core is mounted, so edits reload without a rebuild.
# Production uses deploy/compose.production.yaml instead (see docs/deploy.md).

x-app: &app
  image: digital-hub:dev
  env_file:
    - path: .env
      required: false
  environment:
    DEBUG: ${DEBUG:-True}
    USE_SQLITE: "False"
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${DATABASE_NAME:-digital_hub}
    DATABASE_USER: ${DATABASE_USER:-digital_hub}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:-digital_hub}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    USE_REDIS_CHANNELS: "True"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    # Admas AI's web search for general questions (core/integrations/websearch).
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  volumes:
    - ./core:/app/core
    # Key files (Firebase), git-ignored; see docs/deploy.md.
    - ./secrets:/app/secrets:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    # The one image is built here only; worker and beat run the same image.
    build: .
    # Daphne's runserver: ASGI (WebSockets work) with auto-reload.
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery --app project worker --loglevel info --queues celery,ai_queue
    healthcheck:
      disable: true

  # Scheduler: queues the periodic tasks (CELERY_BEAT_SCHEDULE), e.g. scheduled notifications.
  beat:
    <<: *app
    command: celery --app project beat --loglevel info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  # Private web search for Admas AI's general questions; only the app uses it.
  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    # A fresh secret key on every start: nothing it signs needs to outlive the container.
    entrypoint: ["/bin/sh", "-c", "SEARXNG_SECRET=$$(head -c 32 /dev/urandom | base64) exec /usr/local/searxng/entrypoint.sh"]
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-digital_hub}
      POSTGRES_USER: ${DATABASE_USER:-digital_hub}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-digital_hub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
