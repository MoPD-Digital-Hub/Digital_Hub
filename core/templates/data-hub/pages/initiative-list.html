{% extends "data-hub/base.html" %}
{% load static %}

{% block title %}{{ page_title }} | Data Hub{% endblock %}

{% block style %}
<link rel="stylesheet" href="{% static 'assets/css/components/initiative-spotlight.css' %}?v=20260309f">
<style>
  .initiative-page {
    display: grid;
    gap: 18px;
  }

  .initiative-page-hero {
    display: grid;
    gap: 8px;
  }

  .initiative-page-hero h1 {
    margin: 0;
  }

  .initiative-page-hero p {
    margin: 0;
    color: var(--bs-secondary-color);
    max-width: 72ch;
  }

  .initiative-page .initiative-layout {
    display: block;
  }
</style>
{% endblock %}

{% block content %}
<div class="initiative-page">
  <div class="initiative-page-hero">
    <h1>{{ page_title }}</h1>
    <p>{{ subtitle }}</p>
  </div>

  <section
    class="initiative-section"
    data-initiative-spotlight
    data-endpoint="/api/mobile/initiatives/"
    data-media-base-url="https://time-series.mopd.gov.et/"
    data-limit="200"
    data-shuffle="false"
    data-variant="catalog"
    data-detail-base="/dashboard/projects/initiatives/"
  >
    <div class="initiative-layout" data-initiative-layout></div>
  </section>
</div>
{% endblock %}

{% block script %}
<script type="module" src="{% static 'assets/js/pages/initiative-list.js' %}?v=20260309e"></script>
{% endblock %}
