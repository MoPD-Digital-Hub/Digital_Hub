{% comment %}The theme picker dialog (opened from the account menu) and the theme and hand-gesture scripts.{% endcomment %}

<div class="modal fade" id="themePickerModal" tabindex="-1" aria-labelledby="themePickerTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content theme-picker-modal">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="themePickerTitle">Choose Theme</h5>
                    <p class="theme-picker-copy">Select a dashboard look and apply it instantly.</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="theme-picker-grid">
                    <button type="button" class="theme-picker-card" data-theme-option="light" onclick="apply_dashboard_theme('light')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-light"></span>
                        <strong>Light</strong>
                        <small>Clean default</small>
                    </button>
                    <button type="button" class="theme-picker-card" data-theme-option="dark" onclick="apply_dashboard_theme('dark')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-dark"></span>
                        <strong>Dark</strong>
                        <small>Low light</small>
                    </button>
                    <button type="button" class="theme-picker-card" data-theme-option="ocean" onclick="apply_dashboard_theme('ocean')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-ocean"></span>
                        <strong>Ocean</strong>
                        <small>Cool blue</small>
                    </button>
                    <button type="button" class="theme-picker-card" data-theme-option="forest" onclick="apply_dashboard_theme('forest')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-forest"></span>
                        <strong>Forest</strong>
                        <small>Muted green</small>
                    </button>
                    <button type="button" class="theme-picker-card" data-theme-option="sand" onclick="apply_dashboard_theme('sand')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-sand"></span>
                        <strong>Sand</strong>
                        <small>Warm neutral</small>
                    </button>
                    <button type="button" class="theme-picker-card" data-theme-option="sunset" onclick="apply_dashboard_theme('sunset')" data-bs-dismiss="modal">
                        <span class="theme-picker-swatch theme-picker-swatch-sunset"></span>
                        <strong>Sunset</strong>
                        <small>Soft coral</small>
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" onclick="apply_dashboard_theme_default()" data-bs-dismiss="modal">Default</button>
            </div>
        </div>
    </div>
</div>

<style>
.theme-picker-modal .modal-header {
    align-items: start;
}

.theme-picker-copy {
    margin: 4px 0 0;
    color: var(--bs-secondary-color);
    font-size: 13px;
}

.theme-picker-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.theme-picker-card {
    display: grid;
    justify-items: start;
    gap: 8px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid rgba(15, 23, 42, 0.08);
    background: var(--dh-surface-bg, #fff);
    text-align: left;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.theme-picker-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 24px rgba(15, 23, 42, 0.08);
    border-color: rgba(15, 23, 42, 0.16);
}

.theme-picker-card strong {
    font-size: 14px;
    line-height: 1;
}

.theme-picker-card small {
    color: var(--bs-secondary-color);
    font-size: 12px;
}

.theme-picker-swatch {
    width: 100%;
    height: 56px;
    border-radius: 12px;
    border: 1px solid rgba(15, 23, 42, 0.08);
}

.theme-picker-swatch-light { background: linear-gradient(135deg, #ffffff, #edf2f7); }
.theme-picker-swatch-dark { background: linear-gradient(135deg, #101a2b, #1f334f); }
.theme-picker-swatch-ocean { background: linear-gradient(135deg, #d9edf8, #7cb6d9); }
.theme-picker-swatch-forest { background: linear-gradient(135deg, #e2efdf, #7da283); }
.theme-picker-swatch-sand { background: linear-gradient(135deg, #f8edd6, #d7ba83); }
.theme-picker-swatch-sunset { background: linear-gradient(135deg, #fde0d4, #dd8666); }

@media (max-width: 575.98px) {
    .theme-picker-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
function resolveThemeMode(theme) {
    return theme === "dark" ? "dark" : "light";
}

function apply_dashboard_theme(theme) {
    const root = document.documentElement;
    root.setAttribute("data-dashboard-theme", theme);
    try {
        localStorage.setItem("dashboardTheme", theme);
        localStorage.setItem("theme", resolveThemeMode(theme));
    } catch (e) {}
    layout_change(resolveThemeMode(theme));
    syncThemePicker(theme);
    document.dispatchEvent(new CustomEvent("dashboard-theme-change", { detail: { theme } }));
}

function apply_dashboard_theme_default() {
    try {
        localStorage.removeItem("dashboardTheme");
        localStorage.removeItem("theme");
    } catch (e) {}
    document.documentElement.setAttribute("data-dashboard-theme", "light");
    layout_change_default();
    syncThemePicker("light");
    document.dispatchEvent(new CustomEvent("dashboard-theme-change", { detail: { theme: "light" } }));
}

function syncThemePicker(theme) {
    document.querySelectorAll("[data-theme-option]").forEach((node) => {
        node.classList.toggle("active", node.getAttribute("data-theme-option") === theme);
    });
}

function apply_theme(theme) {
    try {
        localStorage.setItem("theme", theme);
    } catch (e) {}
    layout_change(theme);
}

function apply_theme_default() {
    try {
        localStorage.removeItem("theme");
    } catch (e) {}
    layout_change_default();
}

document.addEventListener("DOMContentLoaded", function () {
    var activeTheme = "light";
    try {
        activeTheme = localStorage.getItem("dashboardTheme") || "light";
    } catch (e) {}
    syncThemePicker(activeTheme);
});

function bindGestureNavToggle() {
    var btn = document.getElementById("gesture-control-nav-toggle");
    var label = document.getElementById("gesture-control-nav-label");
    if (!btn) {
        return;
    }

    function getController() {
        return window.appGestureController || window.dashboardGestureController || null;
    }

    function sync() {
        var controller = getController();
        var enabled = Boolean(controller && controller.isEnabled && controller.isEnabled());
        btn.setAttribute("aria-pressed", enabled ? "true" : "false");
        if (label) {
            label.textContent = enabled ? "On" : "Off";
        }
    }

    btn.addEventListener("click", function (event) {
        event.preventDefault();
        var controller = getController();
        if (!controller || !controller.toggle) {
            return;
        }
        controller.toggle();
    });

    window.addEventListener("gesture-control:state", sync);
    window.setTimeout(sync, 0);
    window.setTimeout(sync, 600);
}

document.addEventListener("DOMContentLoaded", bindGestureNavToggle);
</script>
