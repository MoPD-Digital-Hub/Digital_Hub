# nginx site for data-hub.mopd.gov.et with the app running in Docker
# (deploy/compose.production.yaml). See docs/deploy.md.
#
# Keep your existing `ssl_certificate` lines; only the upstream changes: Daphne
# now listens on 127.0.0.1:8000 instead of the domains.sock unix socket.

upstream digital_hub {
    server 127.0.0.1:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name data-hub.mopd.gov.et;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data-hub.mopd.gov.et;

    ssl_certificate     /etc/ssl/certs/data-hub.mopd.gov.et.crt;    # keep your current paths
    ssl_certificate_key /etc/ssl/private/data-hub.mopd.gov.et.key;

    client_max_body_size 100m;

    # Uploaded files: served straight from the server's disk (mounted into the app).
    location /media/ {
        alias /mnt/data/Digital_Hub/core/media/;
        expires 7d;
        access_log off;
    }

    # Static files are served by the app (WhiteNoise) from inside the image, so
    # every deploy ships matching CSS/JS; nginx only caches the response.
    location /static/ {
        proxy_pass http://digital_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        access_log off;
    }

    # WebSockets: AI chat (/ws/chat/, /ws/chat-web/) and messaging.
    location /ws/ {
        proxy_pass http://digital_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://digital_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
